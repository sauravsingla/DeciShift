name: Add Hugging Face dataset badge once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-hf-dataset-badge-once.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Hugging Face dataset badge
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          badge = '[![Hugging Face Dataset](https://img.shields.io/badge/%F0%9F%A4%97%20Hugging%20Face-Dataset-FFD21E)](https://huggingface.co/datasets/sauravsingla08/DeciShift-Decision-Change-Benchmark)'
          if badge not in text:
              anchor = '[![License: Apache-2.0](https://img.shields.io/badge/License-Apache--2.0-blue.svg)](LICENSE)'
              text = text.replace(anchor, anchor + '\n' + badge, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit README update and remove one-time workflow
        run: |
          rm .github/workflows/add-hf-dataset-badge-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/add-hf-dataset-badge-once.yml
          git commit -m "docs: link DeciShift Hugging Face dataset"
          git push
