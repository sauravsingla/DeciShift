name: Add Hugging Face Space badge once

on:
  push:
    paths:
      - '.github/workflows/add-hf-space-badge-once.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Space badge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          badge = '[![Hugging Face Space](https://img.shields.io/badge/%F0%9F%A4%97%20Hugging%20Face-Live%20Space-FFD21E)](https://huggingface.co/spaces/sauravsingla08/DeciShift)'
          if badge not in text:
              dataset = '[![Hugging Face Dataset](https://img.shields.io/badge/%F0%9F%A4%97%20Hugging%20Face-Dataset-FFD21E)](https://huggingface.co/datasets/sauravsingla08/DeciShift-Decision-Change-Benchmark)'
              text = text.replace(dataset, dataset + '\n' + badge, 1)
              p.write_text(text)
          PY
      - name: Commit badge and remove one-time workflow
        run: |
          rm .github/workflows/add-hf-space-badge-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/add-hf-space-badge-once.yml
          git commit -m 'docs: add Hugging Face Space badge'
          git push
