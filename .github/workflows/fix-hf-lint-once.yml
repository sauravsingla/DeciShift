name: Fix Hugging Face lint once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hf-lint-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Hugging Face helper lint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('huggingface/build_dataset.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('\nimport pandas as pd\n', '\n')
          text = text.replace(
              '    records, target = module._records()\n    metrics = module._model_metrics(records, target)\n',
              '    records, _ = module._records()\n',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify lint
        run: |
          python -m pip install 'ruff>=0.6'
          ruff check huggingface/build_dataset.py huggingface/build_space.py

      - name: Commit fix and remove one-time workflow
        run: |
          rm .github/workflows/fix-hf-lint-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add huggingface/build_dataset.py .github/workflows/fix-hf-lint-once.yml
          git commit -m "fix: clean Hugging Face helper lint"
          git push
