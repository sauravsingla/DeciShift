name: Publish README demo video

on:
  push:
    paths:
      - ".github/workflows/publish-readme-video.yml"
      - ".github/scripts/build_readme_video.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-video:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak

      - name: Install DeciShift and video builder dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install Pillow

      - name: Execute real DecisionFlow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p video-run
          decishift graph examples/triage/flow.yaml > video-run/graph.txt
          FLOW_OUTPUT=$(decishift compare examples/triage/flow.yaml)
          printf '%s\n' "$FLOW_OUTPUT" | tee video-run/compare.txt
          RUN_ID=$(printf '%s\n' "$FLOW_OUTPUT" | sed -n 's/^Run ID: //p' | tail -n 1)
          test -n "$RUN_ID"
          decishift verify "$RUN_ID" | tee video-run/verify.txt
          decishift gate "$RUN_ID" --contract examples/triage/decision-contract.yaml | tee video-run/gate.txt

      - name: Build 60-second visual demo
        run: |
          python .github/scripts/build_readme_video.py \
            --input-dir video-run \
            --output video-run/narrated-temp.mp4 \
            --poster decishift-real-run-poster.png
          cp video-run/silent.mp4 decishift-real-run-silent.mp4
          ffmpeg -y -i video-run/silent.mp4 \
            -vf "fps=4,scale=720:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=64:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle" \
            -loop 0 decishift-real-run-inline.gif

      - name: Upload silent demo assets to v0.3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.3.0 \
            decishift-real-run-silent.mp4 \
            decishift-real-run-inline.gif \
            decishift-real-run-poster.png \
            --clobber
          gh release delete-asset v0.3.0 decishift-real-run-with-voice.mp4 -y || true

      - name: Make silent demo autoplay inline in README
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("README.md"); t=p.read_text(encoding="utf-8"); s=t.index("## 60-second real run"); e=t.index("\n## Install", s); r="## 60-second real run — silent inline playback\n\nThis demo is generated from a **fresh GitHub Actions execution** of the bundled synthetic triage DecisionFlow. The workflow runs `graph → compare → verify → gate`, then renders the actual results as a silent 60-second animation.\n\n![DeciShift 60-second real DecisionFlow run — silent inline playback](https://github.com/sauravsingla/DeciShift/releases/download/v0.3.0/decishift-real-run-inline.gif)\n\nThe recorded run compares 18 historical records: 11 actions change, giving a 61.11% action-shift rate. The largest software-counterfactual attribution is `failure_risk_model` at 34.51%, followed by `triage_policy` at 28.87%, `safety_rules` at 23.24%, and `sensor_features` at 13.38%. Evidence verification passes and the configured Decision Contract returns `PASS`. A contract pass means only that the observed changes remain inside the user-declared governance limits; it is not proof that the candidate is automatically safer, better, fairer, compliant or correct.\n\nThe animation plays directly in the README with no audio and no download required. A silent MP4 is also retained as a GitHub release asset. The demo is reproducible through [`Publish README demo video`](https://github.com/sauravsingla/DeciShift/actions/workflows/publish-readme-video.yml).\n"; p.write_text(t[:s]+r+t[e:], encoding="utf-8")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: autoplay silent real-run demo in README"
            git push
          fi
