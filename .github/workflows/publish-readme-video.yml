name: Build README demo assets

on:
  push:
    paths:
      - ".github/workflows/publish-readme-video.yml"
      - ".github/scripts/build_readme_video.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-demo-assets:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install system video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak

      - name: Install DeciShift and video builder dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install Pillow

      - name: Execute real DecisionFlow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p video-run
          decishift graph examples/triage/flow.yaml > video-run/graph.txt
          FLOW_OUTPUT=$(decishift compare examples/triage/flow.yaml)
          printf '%s\n' "$FLOW_OUTPUT" | tee video-run/compare.txt
          RUN_ID=$(printf '%s\n' "$FLOW_OUTPUT" | sed -n 's/^Run ID: //p' | tail -n 1)
          test -n "$RUN_ID"
          decishift verify "$RUN_ID" | tee video-run/verify.txt
          decishift gate "$RUN_ID" --contract examples/triage/decision-contract.yaml | tee video-run/gate.txt

      - name: Build 60-second visual demo
        run: |
          python .github/scripts/build_readme_video.py \
            --input-dir video-run \
            --output video-run/narrated-temp.mp4 \
            --poster decishift-real-run-poster.png
          cp video-run/silent.mp4 decishift-real-run-silent.mp4
          ffmpeg -y -i video-run/silent.mp4 \
            -vf "fps=4,scale=720:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=64:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle" \
            -loop 0 decishift-real-run-inline.gif

      - name: Upload generated demo assets as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decishift-readme-demo-${{ github.sha }}
          path: |
            decishift-real-run-silent.mp4
            decishift-real-run-inline.gif
            decishift-real-run-poster.png
            video-run/graph.txt
            video-run/compare.txt
            video-run/verify.txt
            video-run/gate.txt
          if-no-files-found: error
          retention-days: 14
