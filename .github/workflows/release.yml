name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: release validation / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install release candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run test, lint, type, API, and trust-coverage gates
        run: |
          ruff check .
          python -m mypy decishift/evidence.py decishift/flow/actions.py decishift/flow/node.py
          python scripts/generate_api_reference.py --check
          pytest --cov=decishift --cov-report=term-missing --cov-report=json:coverage.json
          python scripts/check_trust_coverage.py coverage.json
      - name: Full graph compare verify gate smoke test
        run: python scripts/platform_smoke.py

  build:
    name: build distributions and provenance
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify release versions and tag
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          with open("pyproject.toml", "rb") as f:
              package_version = tomllib.load(f)["project"]["version"]

          version_tree = ast.parse(Path("decishift/version.py").read_text(encoding="utf-8"))
          runtime_version = None
          for node in version_tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              for target in node.targets:
                  if isinstance(target, ast.Name) and target.id == "__version__":
                      if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                          runtime_version = node.value.value

          if runtime_version is None:
              raise SystemExit("Could not read __version__ from decishift/version.py")
          if runtime_version != package_version:
              raise SystemExit(
                  f"Runtime version {runtime_version} does not match pyproject version {package_version}."
              )

          release_tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{package_version}"
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag} does not match package version {expected_tag}."
              )

          print(f"Verified release {release_tag}: package/runtime version {package_version}.")
          PY
      - name: Build package and release metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/generate_sbom.py
          sha256sum dist/* > release-metadata/SHA256SUMS.txt
      - name: Attest Python distributions
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*"
      - name: Attest release metadata
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "release-metadata/*"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata/
          if-no-files-found: error

  attach-release-metadata:
    name: attach SBOM and checksums to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release-metadata/
      - name: Attach metadata to the existing release
        run: gh release upload "$RELEASE_TAG" release-metadata/* --clobber

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/decishift/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
