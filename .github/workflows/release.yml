name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release versions and tag
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          with open("pyproject.toml", "rb") as f:
              package_version = tomllib.load(f)["project"]["version"]

          version_tree = ast.parse(Path("decishift/version.py").read_text(encoding="utf-8"))
          runtime_version = None
          for node in version_tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              for target in node.targets:
                  if isinstance(target, ast.Name) and target.id == "__version__":
                      if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                          runtime_version = node.value.value

          if runtime_version is None:
              raise SystemExit("Could not read __version__ from decishift/version.py")
          if runtime_version != package_version:
              raise SystemExit(
                  f"Runtime version {runtime_version} does not match pyproject version {package_version}."
              )

          release_tag = os.environ["GITHUB_REF_NAME"]
          expected_tag = f"v{package_version}"
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag} does not match package version {expected_tag}."
              )

          print(f"Verified release {release_tag}: package/runtime version {package_version}.")
          PY
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/decishift/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
