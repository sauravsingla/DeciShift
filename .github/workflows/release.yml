name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-policy:
    name: release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - name: Require protected main and current-main release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse HEAD)
          python - "$RELEASE_COMMIT" <<'PY'
          import json
          import os
          import sys
          import urllib.request

          release_commit = sys.argv[1]
          repository = os.environ["GITHUB_REPOSITORY"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/branches/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "decishift-release-policy",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              main = json.load(response)

          if not main.get("protected", False):
              raise SystemExit(
                  "Release blocked: main is not protected. Enable the repository main-branch ruleset before publishing."
              )

          main_commit = main.get("commit", {}).get("sha")
          if main_commit != release_commit:
              raise SystemExit(
                  "Release blocked: tag/checkout commit "
                  f"{release_commit} is not the current protected main head {main_commit}."
              )

          print(f"Release policy passed: protected main head is {main_commit}.")
          PY

  validate-release:
    name: release validation / Python ${{ matrix.python-version }}
    needs: release-policy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install release candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run test and lint gates
        run: |
          ruff check .
          pytest --cov=decishift --cov-report=term-missing
      - name: Full graph compare verify gate smoke test
        shell: bash
        run: |
          set -euo pipefail
          decishift graph examples/triage/flow.yaml
          FLOW_OUTPUT=$(decishift compare examples/triage/flow.yaml)
          printf '%s\n' "$FLOW_OUTPUT"
          RUN_ID=$(printf '%s\n' "$FLOW_OUTPUT" | sed -n 's/^Run ID: //p' | tail -n 1)
          test -n "$RUN_ID"
          decishift verify "$RUN_ID"
          decishift gate "$RUN_ID" --contract examples/triage/decision-contract.yaml

  build:
    name: build distributions
    needs: validate-release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify release versions and tag
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          with open("pyproject.toml", "rb") as f:
              package_version = tomllib.load(f)["project"]["version"]

          version_tree = ast.parse(Path("decishift/version.py").read_text(encoding="utf-8"))
          runtime_version = None
          for node in version_tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              for target in node.targets:
                  if isinstance(target, ast.Name) and target.id == "__version__":
                      if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                          runtime_version = node.value.value

          if runtime_version is None:
              raise SystemExit("Could not read __version__ from decishift/version.py")
          if runtime_version != package_version:
              raise SystemExit(
                  f"Runtime version {runtime_version} does not match pyproject version {package_version}."
              )

          release_tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{package_version}"
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag} does not match package version {expected_tag}."
              )

          print(f"Verified release {release_tag}: package/runtime version {package_version}.")
          PY
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/decishift/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
