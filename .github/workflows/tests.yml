name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=decishift
      - run: python -m build
      - run: python -m twine check dist/*
      - run: decishift demo --rows 1000 --no-save
      - name: Inspect DecisionFlow graph
        run: decishift graph examples/triage/flow.yaml
      - name: Run, verify, and gate DecisionFlow example
        shell: bash
        run: |
          set -euo pipefail
          FLOW_OUTPUT=$(decishift compare examples/triage/flow.yaml)
          printf '%s\n' "$FLOW_OUTPUT"
          RUN_ID=$(printf '%s\n' "$FLOW_OUTPUT" | sed -n 's/^Run ID: //p' | tail -n 1)
          test -n "$RUN_ID"
          decishift verify "$RUN_ID"
          decishift gate "$RUN_ID" --contract examples/triage/decision-contract.yaml
