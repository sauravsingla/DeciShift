name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Enforce import ordering on new quality surfaces
        if: matrix.python-version == '3.11'
        run: >-
          ruff check --select I
          scripts/check_trust_coverage.py
          scripts/generate_api_reference.py
          scripts/generate_sbom.py
          scripts/platform_smoke.py
          tests/test_evidence_golden.py
          tests/test_properties.py
      - name: Type-check trust-critical public surfaces
        if: matrix.python-version == '3.11'
        run: python -m mypy decishift/evidence.py decishift/flow/actions.py decishift/flow/node.py
      - name: Verify generated API reference
        if: matrix.python-version == '3.11'
        run: python scripts/generate_api_reference.py --check
      - name: Smoke-test release SBOM generation
        if: matrix.python-version == '3.11'
        run: python scripts/generate_sbom.py --output /tmp/decishift-sbom.cdx.json
      - run: pytest --cov=decishift --cov-report=term-missing --cov-report=json:coverage.json
      - name: Enforce trust-critical coverage floor
        if: matrix.python-version == '3.11'
        run: python scripts/check_trust_coverage.py coverage.json
      - run: python -m build
      - run: python -m twine check dist/*
      - run: decishift demo --rows 1000 --no-save
      - name: Inspect DecisionFlow graph
        run: decishift graph examples/triage/flow.yaml
      - name: Run, verify, and gate DecisionFlow example
        shell: bash
        run: |
          set -euo pipefail
          FLOW_OUTPUT=$(decishift compare examples/triage/flow.yaml)
          printf '%s\n' "$FLOW_OUTPUT"
          RUN_ID=$(printf '%s\n' "$FLOW_OUTPUT" | sed -n 's/^Run ID: //p' | tail -n 1)
          test -n "$RUN_ID"
          decishift verify "$RUN_ID"
          decishift gate "$RUN_ID" --contract examples/triage/decision-contract.yaml
      - name: Public scikit-learn DecisionFlow
        if: matrix.python-version == '3.11'
        run: python examples/public_wine_sklearn/run.py

  minimum-supported-dependencies:
    name: minimum-supported-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install declared dependency floors
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.24.0" \
            "pandas==2.0.0" \
            "PyYAML==6.0" \
            "typer==0.26.0" \
            "scikit-learn==1.3.0" \
            "pytest==8.0.0" \
            "pytest-cov==5.0.0" \
            "hypothesis==6.112.0" \
            "ruff==0.6.0" \
            "build==1.2.0" \
            "twine==5.1.0"
          python -m pip install -e . --no-deps
      - run: ruff check .
      - run: pytest --cov=decishift --cov-report=term-missing --cov-report=json:coverage.json
      - run: python scripts/check_trust_coverage.py coverage.json
      - name: Full DecisionFlow trust smoke test
        run: python scripts/platform_smoke.py

  platform-smoke:
    name: platform-smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_cli_integration.py tests/test_v03_flow_graph.py tests/test_v03_typed_action_evidence.py tests/test_evidence_golden.py
      - run: python scripts/platform_smoke.py

  xgboost-optional:
    name: optional-dependency / xgboost
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,xgboost]'
      - run: pytest tests/test_optional_adapters.py -k xgboost
      - name: Public XGBoost DecisionFlow
        run: python examples/public_digits_xgboost/run.py

  lightgbm-optional:
    name: optional-dependency / lightgbm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,lightgbm]'
      - run: pytest tests/test_optional_adapters.py -k lightgbm
