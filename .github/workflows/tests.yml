name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=decishift --cov-report=term-missing
      - run: python -m build
      - run: python -m twine check dist/*
      - run: decishift demo --rows 1000 --no-save
      - name: Inspect DecisionFlow graph
        run: decishift graph examples/triage/flow.yaml
      - name: Run, verify, and gate DecisionFlow example
        shell: bash
        run: |
          set -euo pipefail
          FLOW_OUTPUT=$(decishift compare examples/triage/flow.yaml)
          printf '%s\n' "$FLOW_OUTPUT"
          RUN_ID=$(printf '%s\n' "$FLOW_OUTPUT" | sed -n 's/^Run ID: //p' | tail -n 1)
          test -n "$RUN_ID"
          decishift verify "$RUN_ID"
          decishift gate "$RUN_ID" --contract examples/triage/decision-contract.yaml

  minimum-supported-dependencies:
    name: minimum-supported-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install declared dependency floors
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.24.0" \
            "pandas==2.0.0" \
            "PyYAML==6.0" \
            "typer==0.26.0" \
            "scikit-learn==1.3.0" \
            "pytest==8.0.0" \
            "pytest-cov==5.0.0" \
            "ruff==0.6.0" \
            "build==1.2.0" \
            "twine==5.1.0"
          python -m pip install -e . --no-deps
      - run: ruff check .
      - run: pytest --cov=decishift --cov-report=term-missing
      - name: Full DecisionFlow trust smoke test
        shell: bash
        run: |
          set -euo pipefail
          decishift graph examples/triage/flow.yaml
          FLOW_OUTPUT=$(decishift compare examples/triage/flow.yaml)
          printf '%s\n' "$FLOW_OUTPUT"
          RUN_ID=$(printf '%s\n' "$FLOW_OUTPUT" | sed -n 's/^Run ID: //p' | tail -n 1)
          test -n "$RUN_ID"
          decishift verify "$RUN_ID"
          decishift gate "$RUN_ID" --contract examples/triage/decision-contract.yaml

  xgboost-optional:
    name: optional-dependency / xgboost
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,xgboost]'
      - run: pytest tests/test_optional_adapters.py -k xgboost

  lightgbm-optional:
    name: optional-dependency / lightgbm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,lightgbm]'
      - run: pytest tests/test_optional_adapters.py -k lightgbm
