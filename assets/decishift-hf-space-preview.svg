<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#10182b"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b8fff"/><stop offset="1" stop-color="#9e78ff"/></linearGradient>
  </defs>
  <rect width="1200" height="690" rx="24" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="56" y="48" fill="#9db4ff" font-size="13" font-weight="700" letter-spacing="2">ML BEHAVIORAL REGRESSION TESTING</text>
    <text x="56" y="96" fill="#edf2ff" font-size="42" font-weight="800">DeciShift</text>
    <text x="56" y="129" fill="#9fb0cf" font-size="18">Decision Change Explorer — public Digits/XGBoost evaluation evidence</text>
    <rect x="56" y="156" width="1088" height="48" rx="10" fill="#10192c"/>
    <rect x="56" y="156" width="4" height="48" rx="2" fill="#7ea1ff"/>
    <text x="76" y="185" fill="#dbe4ff" font-size="15"><tspan font-weight="700">Public case study:</tspan> model metrics improve, while record-level final actions still move.</text>
    <g>
      <rect x="56" y="224" width="250" height="112" rx="18" fill="#121a2d" stroke="#2b3b61"/>
      <text x="76" y="252" fill="#9fb0cf" font-size="13">Evaluation records</text>
      <text x="76" y="296" fill="#edf2ff" font-size="34" font-weight="800">719</text>
      <text x="76" y="319" fill="#9fb0cf" font-size="12">Deterministic held-out split</text>
      <rect x="326" y="224" width="250" height="112" rx="18" fill="#121a2d" stroke="#2b3b61"/>
      <text x="346" y="252" fill="#9fb0cf" font-size="13">Changed final actions</text>
      <text x="346" y="296" fill="#edf2ff" font-size="34" font-weight="800">30</text>
      <text x="346" y="319" fill="#9fb0cf" font-size="12">4.17% of records</text>
      <rect x="596" y="224" width="250" height="112" rx="18" fill="#121a2d" stroke="#2b3b61"/>
      <text x="616" y="252" fill="#9fb0cf" font-size="13">Accuracy</text>
      <text x="616" y="296" fill="#edf2ff" font-size="34" font-weight="800">91.79%</text>
      <text x="616" y="319" fill="#9fb0cf" font-size="12">Baseline 90.26%</text>
      <rect x="866" y="224" width="278" height="112" rx="18" fill="#121a2d" stroke="#2b3b61"/>
      <text x="886" y="252" fill="#9fb0cf" font-size="13">ROC AUC</text>
      <text x="886" y="296" fill="#edf2ff" font-size="34" font-weight="800">0.9472</text>
      <text x="886" y="319" fill="#9fb0cf" font-size="12">Baseline 0.9429</text>
    </g>
    <rect x="56" y="356" width="526" height="260" rx="18" fill="#121a2d" stroke="#2b3b61"/>
    <text x="76" y="390" fill="#edf2ff" font-size="20" font-weight="700">Changed action transitions</text>
    <text x="76" y="429" fill="#edf2ff" font-size="14">auto_not_8 → manual_review</text>
    <rect x="268" y="416" width="220" height="12" rx="6" fill="#0b1222" stroke="#273756"/>
    <rect x="268" y="416" width="220" height="12" rx="6" fill="url(#bar)"/>
    <text x="515" y="429" fill="#edf2ff" font-size="14" text-anchor="end">13</text>
    <text x="76" y="475" fill="#edf2ff" font-size="14">manual_review → auto_not_8</text>
    <rect x="268" y="462" width="220" height="12" rx="6" fill="#0b1222" stroke="#273756"/>
    <rect x="268" y="462" width="152" height="12" rx="6" fill="url(#bar)"/>
    <text x="515" y="475" fill="#edf2ff" font-size="14" text-anchor="end">9</text>
    <text x="76" y="521" fill="#edf2ff" font-size="14">manual_review → auto_8</text>
    <rect x="268" y="508" width="220" height="12" rx="6" fill="#0b1222" stroke="#273756"/>
    <rect x="268" y="508" width="135" height="12" rx="6" fill="url(#bar)"/>
    <text x="515" y="521" fill="#edf2ff" font-size="14" text-anchor="end">8</text>
    <text x="76" y="578" fill="#9fb0cf" font-size="12">Counts include only records whose final operational action changed.</text>
    <rect x="602" y="356" width="542" height="260" rx="18" fill="#121a2d" stroke="#2b3b61"/>
    <text x="622" y="390" fill="#edf2ff" font-size="20" font-weight="700">Software-counterfactual attribution</text>
    <text x="622" y="429" fill="#edf2ff" font-size="14">model</text>
    <rect x="728" y="416" width="280" height="12" rx="6" fill="#0b1222" stroke="#273756"/>
    <rect x="728" y="416" width="280" height="12" rx="6" fill="url(#bar)"/>
    <text x="1114" y="429" fill="#edf2ff" font-size="14" text-anchor="end">48.86%</text>
    <text x="622" y="475" fill="#edf2ff" font-size="14">policy</text>
    <rect x="728" y="462" width="280" height="12" rx="6" fill="#0b1222" stroke="#273756"/>
    <rect x="728" y="462" width="267" height="12" rx="6" fill="url(#bar)"/>
    <text x="1114" y="475" fill="#edf2ff" font-size="14" text-anchor="end">46.59%</text>
    <text x="622" y="521" fill="#edf2ff" font-size="14">rules</text>
    <rect x="728" y="508" width="280" height="12" rx="6" fill="#0b1222" stroke="#273756"/>
    <rect x="728" y="508" width="26" height="12" rx="6" fill="url(#bar)"/>
    <text x="1114" y="521" fill="#edf2ff" font-size="14" text-anchor="end">4.55%</text>
    <text x="622" y="558" fill="#9fb0cf" font-size="12">Executable software counterfactual over this fixed evaluation.</text>
    <text x="622" y="579" fill="#9fb0cf" font-size="12">Not a claim of real-world causality.</text>
    <rect x="56" y="636" width="1088" height="38" rx="12" fill="#111b31" stroke="#2b3b61"/>
    <text x="76" y="661" fill="#9fb0cf" font-size="13">Decision Contract:</text>
    <text x="213" y="661" fill="#ff6b6b" font-size="15" font-weight="900">BLOCK</text>
    <text x="310" y="661" fill="#9fb0cf" font-size="13">actual_digit=6 cohort shift 9.41% exceeds declared 8% limit</text>
  </g>
</svg>