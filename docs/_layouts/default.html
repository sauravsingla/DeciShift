<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DeciShift">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareSourceCode",
    "name": "DeciShift",
    "description": "{{ site.description | escape }}",
    "codeRepository": "https://github.com/sauravsingla/DeciShift",
    "programmingLanguage": "Python",
    "license": "https://www.apache.org/licenses/LICENSE-2.0",
    "url": "{{ site.url }}{{ site.baseurl }}/"
  }
  </script>

  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ site.baseurl }}/">DeciShift</a>
      <nav aria-label="Primary">
        <a href="{{ site.baseurl }}/getting-started.html">Getting started</a>
        <a href="{{ site.baseurl }}/use-cases.html">Use cases</a>
        <a href="{{ site.baseurl }}/community.html">Community</a>
        <a href="https://github.com/sauravsingla/DeciShift">GitHub</a>
        <a href="https://pypi.org/project/decishift/">PyPI</a>
      </nav>
    </div>
  </header>

  <main class="wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>DeciShift · Open-source ML behavioral regression testing and decision-change analysis · Apache-2.0</p>
    </div>
  </footer>
</body>
</html>
