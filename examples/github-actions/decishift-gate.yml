name: decishift-decision-contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  decision-change-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install decishift
      - name: Compare decision-system versions
        run: decishift compare examples/my-comparison.yaml --save
      - name: Gate saved evidence
        shell: bash
        run: |
          RUN_ID=$(ls -1t .decishift/runs | head -1)
          decishift verify "$RUN_ID"
          decishift gate "$RUN_ID" --contract examples/decision-contract.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: decishift-evidence
          path: .decishift/runs/
