[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decishift"
version = "0.3.0"
description = "Explain why decisions changed between ML system versions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Saurav Singla"}]
maintainers = [{name = "Saurav Singla"}]
keywords = ["machine-learning", "decision-systems", "model-diffing", "counterfactual-attribution", "ml-observability", "explainability", "mlops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
xgboost = ["xgboost>=2.0"]
lightgbm = ["lightgbm>=4.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5.1",
  "scikit-learn>=1.3",
]

[project.scripts]
decishift = "decishift.cli:app"

[project.urls]
Homepage = "https://github.com/sauravsingla/DeciShift"
Repository = "https://github.com/sauravsingla/DeciShift"
Issues = "https://github.com/sauravsingla/DeciShift/issues"
Changelog = "https://github.com/sauravsingla/DeciShift/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["decishift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["decishift"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]
