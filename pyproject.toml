[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decishift"
version = "0.1.0"
description = "Explain why decisions changed between ML system versions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Saurav Singla"}]
keywords = ["machine-learning", "model-diff", "decision-systems", "ml-observability", "explainability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
xgboost = ["xgboost>=2.0"]
lightgbm = ["lightgbm>=4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "scikit-learn>=1.3"]

[project.scripts]
decishift = "decishift.cli:app"

[tool.setuptools.packages.find]
include = ["decishift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["decishift"]
branch = true
